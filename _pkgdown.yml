# ---------------------------------------------------------------------------
# DO NOT BUILD THIS SITE WITH A BARE pkgdown::build_site().
#
# pkgdown renders every .md file at the package root, including untracked
# local development notes, which are not public documents. `.Rbuildignore`
# does not prevent it; pkgdown never consults it, and there is no configuration
# option here that does. The fix is a post-build step:
#
#   Rscript tools/build-site.R
#
# which builds and then runs tools/clean-site.R. That script fails loudly if
# anything survives, and reports any unexpected file at the site root, so a
# local document added later is caught rather than silently published.
#
# ---------------------------------------------------------------------------

# DEPLOYMENT IS NOW ENABLED, so `url:` is set here and in DESCRIPTION's URL
# field, in this commit, as the note that stood here required. pkgdown now
# writes absolute links and a sitemap against this address.
#
# The address resolves only once the repository is public and Pages is enabled
# on the gh-pages branch, which .github/workflows/pkgdown.yaml publishes to.
# Until then R CMD check will NOTE both URLs as unreachable, exactly as it
# already does for the repository URL; that note is expected and is not a
# defect.
url: https://djgriffin13.github.io/rnetis/

template:
  bootstrap: 5

# TUTORIAL.html is a standalone, self-contained page under pkgdown/assets/,
# which pkgdown copies to the site root unchanged. It is not a vignette and
# is not rendered here: it is generated, with every result captured from a
# live R session, by the builder in tools/tutorial/. Rebuild it with
#
#   python tools/tutorial/make.py
#
# whenever the output it shows could have changed, then commit the result.
# tools/clean-site.R lists both it and tutorial-figures/ as expected at the
# site root; without those entries the deploy workflow fails the publish.
navbar:
  structure:
    left: [tutorial, reference, articles, news]
  components:
    tutorial:
      text: Tutorial
      href: TUTORIAL.html

